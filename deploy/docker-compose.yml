# Auto Edits on the VPS. Kept apart from the other apps on the machine:
#   - its own project name, network and data volume
#   - hard limits on memory and processor, so it cannot starve n8n and the rest
#   - listens on this machine only (127.0.0.1); the existing Traefik proxy passes
#     edits.cele-brat.solutions to it (same label pattern as the CCW app)
# Settings live in a file named .env next to this one:
#   AUTOEDITS_KEY=<long secret>                 the studio key (the plug-in's key from before accounts)
#   AUTOEDITS_ADMIN_EMAIL=<studio email>        the admin account; owns everything made before accounts
#   SMTP_USER=<workspace account>  SMTP_PASSWORD=<Google app password>  MAIL_FROM=Auto Edits <no-reply@...>
name: auto-edits
services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      AUTOEDITS_KEY: ${AUTOEDITS_KEY:?put AUTOEDITS_KEY in deploy/.env}
      AUTOEDITS_ADMIN_EMAIL: ${AUTOEDITS_ADMIN_EMAIL:?put AUTOEDITS_ADMIN_EMAIL in deploy/.env}
      AUTOEDITS_BASE_URL: ${AUTOEDITS_BASE_URL:-https://edits.cele-brat.solutions}
      # account emails through Google Workspace; without SMTP_USER they go to the log instead
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Cloudflare R2: when these four are in deploy/.env the photos live there, not on this disk
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      # Razorpay: without these, buying stays "coming soon"
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      AUTOEDITS_INVOICE_ADDRESS: ${AUTOEDITS_INVOICE_ADDRESS:-Ajmer, Rajasthan}
      AUTOEDITS_WORKING_GB: ${AUTOEDITS_WORKING_GB:-8}
    volumes:
      - data:/data
    ports:
      - "127.0.0.1:${APP_PORT:-8431}:8000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.autoedits.rule=Host(`${APP_DOMAIN:-edits.cele-brat.solutions}`)
      - traefik.http.routers.autoedits.entrypoints=websecure
      - traefik.http.routers.autoedits.tls.certresolver=letsencrypt
      - traefik.http.services.autoedits.loadbalancer.server.port=8000
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks:
      - autoedits
  # Makes the finished pictures for exports. Apart from the server, so a long export never slows the app screen.
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "server.worker"]
    restart: unless-stopped
    environment:
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      AUTOEDITS_WARM_UP: "0"
      AUTOEDITS_EXPORT_WORKERS: ${AUTOEDITS_EXPORT_WORKERS:-2}
    volumes:
      - data:/data
    mem_limit: 5g
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks:
      - autoedits
volumes:
  data:
networks:
  autoedits:
