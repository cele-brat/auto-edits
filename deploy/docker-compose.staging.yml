# A STAGING copy of Auto Edits on the same VPS: a second pair of containers (server-staging,
# worker-staging) from the same image, on port 8432, with their own data volume.
#   AUTOEDITS_ENV=staging   -> "STAGING" banner in the top bar, test Razorpay keys only (the server refuses
#                               to start with a live key), no outgoing email except to the studio address.
# Start it with ONE line on the VPS:  ./deploy/staging.sh up      (see deploy/STAGING.md)
# Settings come from deploy/.env.staging (copy deploy/.env and change the keys; see STAGING.md).
name: auto-edits-staging
services:
  server-staging:
    image: auto-edits-server:latest                 # the same image name production's compose gives its build
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      AUTOEDITS_ENV: staging
      AUTOEDITS_KEY: ${AUTOEDITS_KEY:?put AUTOEDITS_KEY in deploy/.env.staging}
      AUTOEDITS_ADMIN_EMAIL: ${AUTOEDITS_ADMIN_EMAIL:?put AUTOEDITS_ADMIN_EMAIL in deploy/.env.staging}
      AUTOEDITS_BASE_URL: ${AUTOEDITS_BASE_URL:-https://staging.edits.cele-brat.solutions}
      AUTOEDITS_SITE: ${AUTOEDITS_BASE_URL:-https://staging.edits.cele-brat.solutions}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # its own bucket (or prefix) so a staging test can never remove production photos; leave empty to keep photos on disk
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      # TEST keys only (rzp_test_...): with a live key the server refuses to start
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      AUTOEDITS_INVOICE_ADDRESS: ${AUTOEDITS_INVOICE_ADDRESS:-Ajmer, Rajasthan}
      AUTOEDITS_WORKING_GB: ${AUTOEDITS_WORKING_GB:-2}
    volumes:
      - data-staging:/data
    ports:
      - "127.0.0.1:${STAGING_PORT:-8432}:8000"
    labels:
      # Traefik (already on the VPS) passes staging.edits.cele-brat.solutions to this container; nothing in Traefik changes
      - traefik.enable=true
      - traefik.http.routers.autoedits-staging.rule=Host(`${STAGING_DOMAIN:-staging.edits.cele-brat.solutions}`)
      - traefik.http.routers.autoedits-staging.entrypoints=websecure
      - traefik.http.routers.autoedits-staging.tls.certresolver=letsencrypt
      - traefik.http.services.autoedits-staging.loadbalancer.server.port=8000
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks:
      - autoedits-staging
  worker-staging:
    image: auto-edits-server:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "server.worker"]
    restart: unless-stopped
    environment:
      AUTOEDITS_ENV: staging
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      AUTOEDITS_WARM_UP: "0"
      AUTOEDITS_ADMIN_EMAIL: ${AUTOEDITS_ADMIN_EMAIL:-}
      AUTOEDITS_BASE_URL: ${AUTOEDITS_BASE_URL:-https://staging.edits.cele-brat.solutions}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      AUTOEDITS_EXPORT_WORKERS: ${AUTOEDITS_EXPORT_WORKERS:-1}
    volumes:
      - data-staging:/data
    mem_limit: 3g
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks:
      - autoedits-staging
volumes:
  data-staging:
networks:
  autoedits-staging:
