# Deploy / check Auto Edits on the VPS from GitHub.
# Trigger by pushing to one of these branches (the branch name is the job):
#   ops/deploy   -> pull main on the VPS, rebuild, then show commit, containers, backup lines
#   ops/status   -> show commit and containers
#   ops/backups  -> list database backups (server.restore --list)
# The result is posted as a comment on the pushed commit.
# The VPS key can ONLY run deploy/remote.sh (forced command), never a shell.
# This repo is public: nothing private is printed.
name: VPS

on:
  push:
    branches: ["ops/deploy", "ops/status", "ops/backups"]

concurrency:
  group: vps
  cancel-in-progress: false

permissions:
  contents: write   # to post the result as a commit comment

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run on VPS
        env:
          KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -o pipefail
          job="${GITHUB_REF_NAME#ops/}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          echo "187.126.117.49 $HOST_KEY" > ~/.ssh/known_hosts
          code=0
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=yes -o BatchMode=yes \
              root@187.126.117.49 "$job" > out.txt 2>&1 || code=$?
          rm -f ~/.ssh/id
          cat out.txt
          echo "$code" > code.txt

      - name: Post result on the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(cat code.txt 2>/dev/null || echo "?")
          if [ "$code" = "0" ]; then head="OK"; else head="FAILED (exit $code)"; fi
          body=$(printf 'VPS %s: %s\n\n```\n%s\n```\n' "${GITHUB_REF_NAME#ops/}" "$head" "$(tail -c 50000 out.txt 2>/dev/null)")
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -f body="$body" > /dev/null
          [ "$code" = "0" ]
